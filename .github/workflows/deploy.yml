name: Deploy to Pi

# Only published releases deploy. Merging to main does NOT touch the Pi.
# To redeploy an older version: Actions -> Deploy to Pi -> Run workflow, and pick its tag.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, pi]
    # Pre-releases don't deploy, so you can publish one without touching the Pi.
    if: github.event_name != 'release' || !github.event.release.prerelease
    steps:
      # On a release this checks out the release's tag, not the tip of main.
      - uses: actions/checkout@v4

      - name: Sync to /srv/cs370
        run: rsync -a --delete --exclude .git ./ /srv/cs370/

      - name: Run deploy script
        run: |
          cd /srv/cs370
          if [ -x deploy.sh ]; then ./deploy.sh; else echo "no deploy.sh yet, files synced only"; fi
